<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#16365f">
    <title>Sem conexão · Cyberly Diet</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
            font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(to bottom, #102a4c, #16365f, #2b5f9e); color: #1e293b;
        }
        .card { width: 100%; max-width: 360px; background: #fff; border-radius: 24px; padding: 32px 24px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,.35); }
        img { width: 64px; height: 64px; border-radius: 16px; }
        h1 { margin: 20px 0 8px; font-size: 20px; color: #16365f; }
        p { margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: #64748b; }
        button { width: 100%; border: 0; border-radius: 12px; padding: 12px 16px; font-size: 16px; font-weight: 600; color: #fff; background: #16365f; cursor: pointer; }
        button:active { transform: scale(.98); }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="">
        <h1>Sem conexão com internet</h1>
        <p>Verifique o Wi-Fi ou os dados móveis. O app volta sozinho assim que a conexão retornar.</p>
        <button type="button" onclick="location.reload()">Tentar novamente</button>
    </div>
    <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
